<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Wallpapers 4K - Download APK</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d0f1a 0%, #1a162b 50%, #0d0f1a 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .icon {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      background: linear-gradient(135deg, #ff416c, #8a2387);
      box-shadow: 0 10px 25px rgba(255, 65, 108, 0.4);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .badge {
      display: inline-block;
      padding: 4px 14px;
      background: rgba(46, 213, 115, 0.2);
      color: #2ed573;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 18px;
      border: 1px solid rgba(46, 213, 115, 0.4);
    }
    p { font-size: 14px; color: #a4b0be; line-height: 1.5; margin-bottom: 22px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border: none;
      cursor: pointer;
      border-radius: 16px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 10px 25px rgba(108, 92, 231, 0.4);
      transition: all 0.2s;
    }
    .btn:hover { opacity: 0.95; transform: translateY(-1px); }
    .btn:active { transform: scale(0.98); }
    .progress-container {
      display: none;
      margin-top: 16px;
      text-align: left;
    }
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 5px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #2ed573;
      transition: width 0.2s;
    }
    .status-text {
      font-size: 13px;
      color: #a4b0be;
      display: flex;
      justify-content: space-between;
    }
    .success-msg {
      display: none;
      margin-top: 14px;
      padding: 10px;
      background: rgba(46, 213, 115, 0.15);
      border: 1px solid rgba(46, 213, 115, 0.3);
      border-radius: 12px;
      font-size: 13px;
      color: #2ed573;
      font-weight: 600;
    }
    .direct-link {
      margin-top: 16px;
      font-size: 13px;
      color: #747d8c;
    }
    .direct-link a { color: #a29bfe; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📱</div>
    <h1>Anime Wallpapers 4K</h1>
    <div class="badge">● Real AdMob Ads Ready</div>
    <p>Apna Naya APK (47 MB) download karne ke liye neeche button dabayein:</p>

    <button id="downloadBtn" class="btn" onclick="startDownload()">
      📥 Download APK (Direct 1-Click)
    </button>

    <div id="progressContainer" class="progress-container">
      <div class="status-text">
        <span id="statusLabel">Downloading...</span>
        <span id="percentLabel">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>

    <div id="successMsg" class="success-msg">
      ✅ APK successfully downloaded! Check your Downloads folder.
    </div>

    <div class="direct-link">
      Alternative: <a href="./AnimeWallpapers.apk" download="AnimeWallpapers.apk">Click here for classic download</a>
    </div>
  </div>

  <script>
    async function startDownload() {
      const btn = document.getElementById('downloadBtn');
      const prog = document.getElementById('progressContainer');
      const fill = document.getElementById('progressFill');
      const pct = document.getElementById('percentLabel');
      const status = document.getElementById('statusLabel');
      const succ = document.getElementById('successMsg');

      btn.disabled = true;
      btn.style.opacity = '0.6';
      prog.style.display = 'block';
      succ.style.display = 'none';

      try {
        const response = await fetch('./AnimeWallpapers.apk');
        if (!response.ok) throw new Error('Network error');

        const contentLength = response.headers.get('content-length');
        const total = contentLength ? parseInt(contentLength, 10) : 48965421;
        let loaded = 0;

        const reader = response.body.getReader();
        const chunks = [];

        while(true) {
          const {done, value} = await reader.read();
          if (done) break;
          chunks.push(value);
          loaded += value.length;
          const percent = Math.min(100, Math.round((loaded / total) * 100));
          fill.style.width = percent + '%';
          pct.innerText = percent + '%';
          status.innerText = (loaded / (1024 * 1024)).toFixed(1) + ' MB / ' + (total / (1024 * 1024)).toFixed(1) + ' MB';
        }

        const blob = new Blob(chunks, { type: 'application/vnd.android.package-archive' });
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = 'AnimeWallpapers.apk';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(blobUrl);

        succ.style.display = 'block';
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.innerText = '🔄 Download Again';
      } catch (err) {
        console.error(err);
        status.innerText = 'Falling back to direct link...';
        window.location.href = './AnimeWallpapers.apk';
        btn.disabled = false;
        btn.style.opacity = '1';
      }
    }
  </script>
</body>
</html>
