workflows:
  android-workflow:
    name: Android Debug APK Workflow
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Install and Build with Gradle 9.3.1
        script: |
          wget https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -P /tmp
          unzip -q -d /tmp/gradle /tmp/gradle-9.3.1-bin.zip
          export PATH="/tmp/gradle/gradle-9.3.1/bin:$PATH"
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/**/*.apk

